name: engivault_mobile
description: "ENGIVAULT - KTU Learning Simplified Native Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing & Deep Linking
  go_router: ^14.8.1

  # Networking & HTTP
  dio: ^5.8.0+1

  # Secure Platform Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Media & Launchers
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

  # Design & UI Icons
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
